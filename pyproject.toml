[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "battery-arbitrage"
version = "0.1.0"
description = "Day-ahead battery storage arbitrage: LP optimizer, RTE market data, and backtesting."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pulp>=2.7",
    "numpy>=1.24",
    "pandas>=2.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
